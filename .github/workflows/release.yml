name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
         - os: windows-latest
           dist: 'publish'
           installer: 'dist/Better-CrewLink Setup*.exe'
         - os: ubuntu-latest
           dist: 'publish:linux'
           installer: 'dist/Better-CrewLink-*.AppImage'

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libx11-dev

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run ${{ matrix.dist }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          name: BetterCrewLink Installer ${{ runner.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

      - name: Upload Unpacked 64bit
        uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          name: BetterCrewLink Unpacked 64bit
          path: 'dist/win-unpacked'

      - name: Upload Unpacked 32bit
        uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          name: BetterCrewLink Unpacked 32bit
          path: 'dist/win-ia32-unpacked'
