name: Build

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
         - os: windows-latest
           dist: 'dist'
           installer: 'dist/Better-CrewLink Setup*.exe'
         - os: ubuntu-latest
           dist: 'dist:linux'
           installer: 'dist/Better-CrewLink-*.AppImage'


    steps:
      - name: Install Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libx11-dev

      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install yarn (for native git deps)
        run: npm install -g yarn

      - name: Install Dependencies
        run: npm ci

      - name: Verify ESM interop
        run: npm run verify:esm

      - name: Build App
        run: npm run ${{ matrix.dist }} -- --publish never

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: BetterCrewLink Installer ${{ runner.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

      - name: Upload Unpacked
        uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'windows-latest'}}
        with:
          name: BetterCrewLink Unpacked 64bit
          path: 'dist/win-unpacked'
