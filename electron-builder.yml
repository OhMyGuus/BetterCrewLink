appId: net.ottomated.crewlink.beta
productName: Better-CrewLink
copyright: Copyright © 2021 OhMyGuus
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
asarUnpack:
  - node_modules/memoryjs/**
  - node_modules/electron-overlay-window/**
  - node_modules/node-keyboard-watcher/**
npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false

win:
  publish:
    - github
linux:
  target:
    - "AppImage"
  publish:
    - github